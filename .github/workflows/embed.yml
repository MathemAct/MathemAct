# Compute sentence embeddings for published reports and commit data/embeddings.json.
#
# Model: sentence-transformers/all-MiniLM-L6-v2 (Apache 2.0, ~90 MB download, cached).
# The model runs on CPU inside the GitHub-hosted runner — no API keys, no paid service.
#
# Schedule: Monday 04:17 UTC, well after the nightly export (03:17 UTC) so reports.json
# is already fresh. Also dispatchable manually and on push to any embed.py change.
#
# Commit detection: compare the staged file with the committed one, both with generatedAt
# removed, and commit only when the vectors actually changed. A missing file means nothing
# was embedded and is not an error. Then ask deploy.yml to rebuild, as export.yml does.
name: Embed

on:
  schedule:
    - cron: '17 4 * * 1'  # Monday 04:17 UTC
  workflow_dispatch:
    inputs:
      allow_shrink:
        description: 'Allow embeddings to shrink (reports removed)'
        type: boolean
        default: false
  push:
    paths:
      - 'scripts/embed.py'

permissions:
  contents: write
  actions: write

# One embed at a time; never cancel in progress (a partial commit would be inconsistent).
concurrency:
  group: embed
  cancel-in-progress: false

jobs:
  embed:
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history not needed; fetch the working tree only.
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache model weights
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          # Key includes the model name so a model change invalidates the cache.
          key: hf-all-MiniLM-L6-v2-${{ runner.os }}

      - name: Install Python dependencies
        run: pip install --quiet sentence-transformers numpy

      - name: Run embed script
        run: |
          ARGS=""
          if [ "${{ inputs.allow_shrink }}" = "true" ]; then
            ARGS="--allow-shrink"
          fi
          python scripts/embed.py $ARGS

      - name: Detect content change
        id: changed
        run: |
          # A missing file is a normal outcome, not a failure: embed.py writes nothing when
          # there is nothing to embed, which is the state an empty corpus is in. `git add`
          # on a path that does not exist exits 128, and that is what took down every run
          # of this workflow from the day it was added.
          if [ ! -f data/embeddings.json ]; then
            echo "No embeddings file: nothing was embedded, so there is nothing to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git add data/embeddings.json

          # generatedAt moves on every run, so both versions are compared with it removed.
          # This cannot be done line-wise, which is what it used to attempt: embed.py writes
          # the file as a single line of JSON, so any change rewrites that whole line, and a
          # diff's own ---/+++ headers match ^[+-] whatever the filter drops. The old check
          # reported a change on every run, which would have meant a weekly commit and a
          # rebuild for nothing but a moved timestamp.
          strip() {
            python3 -c 'import json,sys; d=json.load(sys.stdin); d.pop("generatedAt", None); print(json.dumps(d, sort_keys=True))'
          }

          new=$(strip < data/embeddings.json)
          old=""
          if git cat-file -e HEAD:data/embeddings.json 2>/dev/null; then
            old=$(git show HEAD:data/embeddings.json | strip)
          fi

          if [ "$new" = "$old" ]; then
            echo "Vectors unchanged; only the timestamp would have moved."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit embeddings
        if: steps.changed.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "Update report embeddings

          all-MiniLM-L6-v2 (Apache 2.0), int8 quantised, $(date -u +%Y-%m-%d)"

      - name: Push
        if: steps.changed.outputs.changed == 'true'
        run: git push

      - name: Trigger deploy
        if: steps.changed.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml --ref main
